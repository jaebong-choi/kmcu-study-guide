<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMCU Study Guide</title>
<meta name="description" content="계명문화대학교 외국인 유학생 입학 가이드 — 한국어학당(어학과정) · 학위과정 입학 진단">
<link rel="icon" href="assets/img/emblem.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--sub:#6e6e73;--mute:#86868b;--line:#e5e5e7;--gray:#f5f5f7;--red:#e0312f;--red-d:#c4221f;--blue:#00449e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
p,li,dd,td{text-wrap:pretty}
h1,h2,h3,h4{text-wrap:balance;margin:0}
a{color:inherit}
button{font:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:980px;padding:13px 24px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .2s}
.pill small{font-size:12px;font-weight:500;opacity:.75}
.pill.red{background:var(--red);color:#fff}.pill.red:hover{background:var(--red-d)}
.pill.glass{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(10px)}.pill.glass:hover{background:rgba(255,255,255,.22)}
.pill.dark{background:var(--ink);color:#fff}.pill.dark:hover{background:#3a3a3c}
.pill.line{background:#fff;color:var(--ink);border-color:#d2d2d7}.pill.line:hover{background:var(--gray)}
.pill.sm{padding:9px 16px;font-size:14px}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.nav .wrap{max-width:1120px;display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{height:26px;display:block}
.brand span{font-size:13px;font-weight:600;color:var(--sub);border-left:1px solid #d2d2d7;padding-left:10px;white-space:nowrap}
.links{display:flex;gap:26px;margin:0 auto;font-size:13px}
.links a{text-decoration:none;color:var(--sub)}.links a:hover{color:var(--ink)}
.right{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid rgba(0,0,0,.18);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--sub);font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.nav .pill{padding:6px 13px;font-size:12px}
@media(max-width:860px){.links{display:none}}
@media(max-width:520px){.brand span,.nav .pill{display:none}}
/* hero */
.hero{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px);display:grid;place-items:center;text-align:center;color:#f5f5f7;padding:80px 16px;
  background:radial-gradient(ellipse 70% 45% at 50% 48%,rgba(0,0,0,.45),rgba(0,0,0,.18) 60%,rgba(0,0,0,0) 80%),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15) 45%,rgba(0,0,0,.7)),url(assets/img/hero.jpg) center 60%/cover #222}
#contact .split{align-items:start}#contact .photo{position:sticky;top:96px}
.hero .eyebrow{color:#ffb547}
.hero h1{font-size:clamp(34px,6vw,62px);font-weight:800;letter-spacing:-.025em;line-height:1.16;margin:14px 0 18px;text-shadow:0 2px 20px rgba(0,0,0,.65)}
.hero p{font-size:clamp(16px,2vw,19px);margin:0 auto;max-width:31em;color:#e8e8ed;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.hero .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
/* sections */
.sec{padding:100px 0}.sec.gray{background:var(--gray)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.photo{border-radius:24px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.12);aspect-ratio:4/3;background:#ddd}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h2{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:10px 0 18px}
.lead{color:var(--sub);font-size:16px;margin:0 0 26px}
.ilist{list-style:none;margin:0 0 30px;padding:0;display:grid;gap:14px;font-size:15px;color:#3a3a3c}
.ilist li{display:flex;gap:12px;align-items:center}
.ico{flex:0 0 34px;height:34px;border-radius:10px;background:#eef3fb;color:var(--blue);display:grid;place-items:center}
.ico svg{width:17px;height:17px}
.ilist b{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:820px){.split{grid-template-columns:1fr;gap:32px}.sec{padding:72px 0}#contact .photo{order:-1}}
/* track cards */
.center{text-align:center;max-width:640px;margin:0 auto 44px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.08)}
.card>img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#ddd}
.card .in{padding:26px 26px 28px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:22px;font-weight:800;margin:6px 0 16px}
.pflow{display:flex;gap:3px;list-style:none;margin:0 0 18px;padding:0}
.pflow li{flex:1 1 0;min-width:0;padding:9px 10px 9px 18px;background:var(--gray);font-size:12px;font-weight:600;line-height:1.35;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
.pflow li span{display:block;font-size:10.5px;font-weight:500;color:var(--mute);margin-top:2px}
.pflow li:first-child{padding-left:10px;background:var(--blue);color:#fff;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%)}
.pflow li:last-child{background:var(--ink);color:#fff;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,11px 50%)}
.pflow li:first-child span,.pflow li:last-child span{color:#fff;opacity:.75}
.pspec{display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;margin:0 0 24px;font-size:14px}
.pspec dt{color:var(--mute);font-weight:500;white-space:nowrap}
.pspec dd{margin:0;font-weight:600}
.card .pill{margin-top:auto;align-self:flex-start}
.note{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;font-size:14px;color:#3a3a3c}
.note b{color:var(--ink)}
@media(max-width:820px){.cards2{grid-template-columns:1fr}}
/* visa */
#visa .card{background:var(--gray);border:0}
#visa .card:hover{transform:none;box-shadow:none}
.vcode{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.vsteps{list-style:none;counter-reset:s;margin:0 0 20px;padding:0;display:grid;gap:10px}
.vsteps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.vsteps li::before{content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.vpoints{margin:0;padding:16px 0 0 18px;border-top:1px solid #dcdce0;font-size:14px;color:#3a3a3c;display:grid;gap:6px}
.vcommon{margin-top:22px;border:1px solid var(--line);border-radius:24px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:18px 32px;align-items:start}
.vcommon h3{font-size:17px;font-weight:800;margin-bottom:10px}
.vcommon ul{margin:0;padding-left:18px;font-size:14.5px;color:#3a3a3c;display:grid;gap:6px}
.vcommon .row{flex-direction:column}
@media(max-width:820px){.vcommon{grid-template-columns:1fr}.vcommon .row{flex-direction:row}}
/* guide */
details{border:1px solid var(--line);border-radius:20px;margin-top:12px;background:#fff}
summary{cursor:pointer;list-style:none;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary .tog{flex-shrink:0;border:1px solid #d2d2d7;border-radius:980px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--blue)}
summary:hover .tog{border-color:var(--blue)}
details .open{display:none}details[open] .open{display:inline}details[open] .closed{display:none}
details .in{padding:0 26px 26px}
details h4{font-size:15px;margin:26px 0 10px}
details p,details li{font-size:14.5px;color:#3a3a3c}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:13px;white-space:nowrap}
.num{text-align:right;white-space:nowrap}
.small{font-size:13px!important;color:var(--mute)!important}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.depts div{background:var(--gray);border-radius:14px;padding:14px 16px}
.depts h5{margin:0 0 6px;font-size:13px;color:var(--blue)}
.depts ul{margin:0;padding-left:16px}
.depts li{font-size:13.5px}
/* contact */
.clist{display:grid;gap:10px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:13px 18px;text-decoration:none;font-size:14px;font-weight:600}
a.banner:hover{background:#fafafa;border-color:var(--ink)}
.banner small{display:block;color:var(--mute);font-size:12.5px;font-weight:500}
.banner.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.banner.primary small{color:#a1a1a6}
a.banner.primary:hover{background:#3a3a3c}
footer{background:var(--gray);text-align:center;padding:48px 16px 56px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
footer img{height:36px;margin-bottom:10px}
footer p{max-width:620px;margin:8px auto 0}
/* diagnosis view */
#diag{display:none;background:var(--gray);min-height:calc(100vh - 56px);min-height:calc(100svh - 56px)}
body.diag #diag{display:block}body.diag main,body.diag footer{display:none}
.chat{max-width:680px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:14px}
.chat .top{display:flex;justify-content:flex-start;margin-bottom:6px}
.msg{display:flex;gap:12px;align-items:flex-start;animation:up .5s cubic-bezier(.16,1,.3,1)}
.av{flex:0 0 36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.av img{height:21px}
.bub{background:#fff;border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:14.5px;max-width:520px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:20px 20px 6px 20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0 48px}
.opts button{background:#fff;border:1px solid #d2d2d7;border-radius:980px;padding:13px 16px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .2s}
.opts button:hover{border-color:var(--ink)}
@media(max-width:560px){.opts{grid-template-columns:1fr;margin-left:0}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
/* 움직임: 첫 화면은 로드 때, 나머지는 스크롤해서 보일 때 아래에서 떠오른다 (UK 가이드와 같은 곡선) */
.fade-in-up{animation:up .9s cubic-bezier(.16,1,.3,1) .1s both}
.rv{opacity:0;transform:translateY(32px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.msg,.result,.fade-in-up{animation:none}.rv{opacity:1;transform:none;transition:none}}
.result{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;margin-top:8px;animation:up .5s cubic-bezier(.16,1,.3,1)}
.status{font-size:24px;font-weight:800;letter-spacing:-.01em}
.status.ok{color:#1a7f37}.status.cond{color:#b45309}.status.no{color:var(--red)}
.rsec{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
.rsec h4{font-size:13px;color:var(--mute);font-weight:600;margin:0 0 8px}
.rsec p,.rsec li{font-size:14.5px;margin:0 0 6px}
.rsec ul{margin:0;padding-left:18px}
.checks{list-style:none;padding:0!important}
.checks input{accent-color:var(--ink);margin-right:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="#top" data-home><img src="assets/img/logo.png" alt="Keimyung College University"><span data-i="brand_sub"></span></a>
  <nav class="links">
    <a href="#" data-go="ls" data-i="nav_ls"></a>
    <a href="#" data-go="deg" data-i="nav_deg"></a>
    <a href="#visa" data-home data-i="nav_visa"></a>
    <a href="#guide" data-home data-i="nav_guide"></a>
  </nav>
  <div class="right">
    <div class="seg" role="group" aria-label="Language"><button data-lang="ko">KO</button><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    <a class="pill line" href="#contact" data-home data-i="nav_contact"></a>
  </div>
</div></header>

<main id="top">
  <section class="hero"><div class="fade-in-up">
    <div class="eyebrow">Keimyung College University · International</div>
    <h1 data-i="hero_title"></h1>
    <p data-i="hero_desc"></p>
    <div class="ctas">
      <button class="pill red" data-go="ls"><span data-i="cta_ls"></span><small>D-4</small></button>
      <button class="pill glass" data-go="deg"><span data-i="cta_deg"></span><small>D-2</small></button>
    </div>
  </div></section>

  <section class="sec"><div class="wrap split">
    <div class="photo"><img src="assets/img/about.jpg" alt="" loading="lazy"></div>
    <div>
      <div class="eyebrow">KMCU Study Guide</div>
      <h2 data-i="about_title"></h2>
      <p class="lead" data-i="about_desc"></p>
      <ul class="ilist" id="about"></ul>
      <div class="row"><button class="pill dark" data-go="ls" data-i="cta_ls"></button><button class="pill line" data-go="deg" data-i="cta_deg"></button></div>
    </div>
  </div></section>

  <section class="sec gray"><div class="wrap">
    <div class="center"><div class="eyebrow">Admission paths</div><h2 data-i="cmp_title"></h2><p class="lead" data-i="cmp_desc"></p></div>
    <div class="cards2" id="tracks"></div>
    <div class="note" data-i="bridge"></div>
  </div></section>

  <section class="sec" id="visa"><div class="wrap">
    <div class="center"><div class="eyebrow">Visa</div><h2 data-i="vz_title"></h2><p class="lead" data-i="vz_desc"></p></div>
    <div class="cards2" id="visaCards"></div>
    <div class="vcommon" id="visaCommon"></div>
  </div></section>

  <section class="sec gray" id="guide"><div class="wrap">
    <div class="eyebrow">Guide</div>
    <h2 data-i="guide_title"></h2>
    <p class="lead" data-i="guide_desc"></p>
    <div id="guideBody"></div>
  </div></section>

  <section class="sec" id="contact"><div class="wrap split">
    <div>
      <h2 data-i="links_title"></h2>
      <p class="lead" data-i="links_desc"></p>
      <div class="clist" id="links"></div>
      <h3 style="font-size:20px;font-weight:800;margin:40px 0 14px" data-i="contact_title"></h3>
      <div class="clist" id="contacts"></div>
    </div>
    <div class="photo"><img src="assets/img/official.jpg" alt="" loading="lazy"></div>
  </div></section>
</main>

<section id="diag"><div class="chat" id="chat" aria-live="polite"></div></section>

<footer>
  <img src="assets/img/emblem.png" alt="">
  <div style="color:var(--ink);font-size:14px;font-weight:700">KMCU Study Guide</div>
  <p data-i="footer"></p>
</footer>

<script>
// ===== 매년 고칠 곳: 날짜 · 금액 (모집요강 기준) =====
const D = {
  ls: { // 2026학년도 한국어학당
    fee: 4400000, app: 100000, topik: 100000, bal: 8000000,
    // [학기, 수업 시작, 수업 끝, 접수 시작, 접수 끝, 면접 시작, 면접 끝]
    terms: [
      ['spring', '2026-03-03', '2026-05-13', '2025-11-17', '2025-12-31', '2026-01-05', '2026-01-07'],
      ['summer', '2026-06-08', '2026-08-14', '2026-03-09', '2026-04-03', '2026-04-06', '2026-04-08'],
      ['fall',   '2026-09-01', '2026-11-13', '2026-06-08', '2026-07-03', '2026-07-06', '2026-07-08'],
      ['winter', '2026-12-01', '2027-02-12', '2026-09-07', '2026-10-02', '2026-10-06', '2026-10-07'],
    ],
  },
  deg: { // 2027학년도 3월 학기 학부
    union: 79000, bal: 16000000, balKmcu: 8000000,
    // [차수, 접수 시작, 접수 끝, 면접 시작, 면접 끝, 합격 발표]
    rounds: [
      [1, '2026-09-07', '2026-09-30', '2026-10-10', '2026-10-11', '2026-10-23'],
      [2, '2026-11-11', '2026-11-25', '2026-11-28', '2026-11-28', '2026-12-04'],
      [3, '2027-01-04', '2027-01-20', '2027-01-23', '2027-01-23', '2027-01-27'],
    ],
    // [계열, 입학학기 등록금, 잔여학기 등록금]
    groups: [['hum1', 3017000, 2779000], ['hum2', 3290000, 3052000], ['eng', 3591000, 3353000]],
    rate: { t6: .8, t5: .7, t2: .5, sejong: .5, eng: .5, kmcu: .5, none: 0 },
  },
  dorm: [['m2', 620000], ['fA4', 490000], ['fB4', 540000], ['fB2', 820000]],
  url: {
    global: 'https://www.kmcu.ac.kr/global/',
    applyLs: 'https://www.kmcu.ac.kr/global/index.php?pCode=MN0000096',
    applyDeg: 'https://www.kmcu.ac.kr/global/index.php?pCode=MN0000097',
    lsInfo: 'https://www.kmcu.ac.kr/global/index.php?pCode=MN0000059',
    degInfo: 'https://www.kmcu.ac.kr/global/index.php?pCode=MN0000036',
  },
};
const FOUR = ['uz', 'vn', 'cn', 'mn']; // 사증발급인정서 대상 국가

// [계열, [학과...]] — 각 항목 [ko, en, es]
const DEPTS = [
  [['간호·보건', 'Nursing & Health', 'Enfermería y Salud'], [
    ['간호학과 (4년제)', 'Nursing (4-year)', 'Enfermería (4 años)'],
    ['보건행정과', 'Health Administration', 'Administración Sanitaria'],
    ['언어치료과', 'Speech-Language Therapy', 'Terapia del Lenguaje'],
    ['응급구조과', 'Emergency Medical Technology', 'Técnico en Emergencias Médicas'],
    ['의료재활과', 'Medical Rehabilitation', 'Rehabilitación Médica'],
    ['작업치료과', 'Occupational Therapy', 'Terapia Ocupacional'],
    ['치위생과', 'Dental Hygiene', 'Higiene Dental']]],
  [['AI융합·디자인·콘텐츠', 'AI, Design & Content', 'IA, Diseño y Contenidos'], [
    ['AI디자인학부 (산업·시각·타투디자인)', 'School of AI Design (Industrial · Visual · Tattoo)', 'Escuela de Diseño con IA (Industrial · Visual · Tatuaje)'],

const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const LOC = { ko: 'ko-KR', en: 'en-US', es: 'es-ES' }, LI = { ko: 0, en: 1, es: 2 };
const today = new Date().toLocaleDateString('sv'); // YYYY-MM-DD
let lang = 'ko';
try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('es') ? 'es' : navigator.language.startsWith('ko') ? 'ko' : 'en'); } catch (e) {}
if (!T[lang]) lang = 'ko';
const L = () => T[lang];
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => o[k] ?? m);
const fmt = n => lang === 'ko' ? n.toLocaleString('ko-KR') + '원' : '₩' + n.toLocaleString(LOC[lang]);
const fd = d => new Date(d + 'T00:00:00').toLocaleDateString(LOC[lang], { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' });
const fr = (a, b) => a === b ? fd(a) : fd(a) + ' ~ ' + fd(b);
const M = () => ({ fee: fmt(D.ls.fee), lsbal: fmt(D.ls.bal), bal: fmt(D.deg.bal), kmcu: fmt(D.deg.balKmcu), min: fmt(D.deg.groups[0][2]), max: fmt(D.deg.groups[2][1]) });
const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
const checks = a => `<ul class="checks">${a.map(x => `<li><label><input type="checkbox"> ${x}</label></li>`).join('')}</ul>`;
const table = (head, rows, numCols = []) => `<div class="tw"><table>${head ? `<tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? 'num' : ''}">${h}</th>`).join('')}</tr>` : ''}${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const sec = (title, body) => `<div class="rsec"><h4>${title}</h4>${body}</div>`;
const isDiag = () => document.body.classList.contains('diag');

// ===== 정적 영역 =====
function renderStatic() {
  const t = L(), m = M();
  document.documentElement.lang = lang;
  $$('[data-i]').forEach(el => { el.innerHTML = fill(t[el.dataset.i] ?? '', m); });
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#about').innerHTML = t.about.map(([k, s]) => `<li><span class="ico">${svg(k)}</span><span>${s}</span></li>`).join('');
  const card = (k, img, rows) => `<article class="card"><img src="assets/img/${img}" alt="" loading="lazy"><div class="in">
    <div class="eyebrow">${t[k + '_full']}</div><h3>${t[k + '_name']}</h3>
    <ol class="pflow">${t['flow_' + k].map(([a, b]) => `<li>${a}<span>${b}</span></li>`).join('')}</ol>
    <dl class="pspec">${rows.map(([a, b]) => `<dt>${t[a]}</dt><dd>${fill(b, m)}</dd>`).join('')}</dl>
    <button class="pill dark sm" data-go="${k}">${t['cta_' + k]} →</button></div></article>`;
  $('#tracks').innerHTML =
    card('ls', 'ls.jpg', [['k_visa', 'D-4-1'], ['k_req', t.v_req_ls], ['k_class', t.v_class_ls], ['k_cost', t.v_cost_ls], ['k_bal', t.v_bal_ls]]) +
    card('deg', 'deg.jpg', [['k_visa', 'D-2-1'], ['k_req', t.v_req_deg], ['k_class', t.v_class_deg], ['k_cost', t.v_cost_deg], ['k_bal', t.v_bal_deg]]);
  const vcard = ([code, sub, steps, points]) => `<article class="card"><div class="in">
    <div class="eyebrow">${sub}</div><div class="vcode" style="margin:10px 0 22px">${code}</div>

    <ul class="vpoints">${points.map(s => `<li>${s}</li>`).join('')}</ul></div></article>`;
  $('#visaCards').innerHTML = vcard(t.vz_ls) + vcard(t.vz_deg);
  $('#visaCommon').innerHTML = `<div><h3>${t.vz_common_title}</h3>${ul(t.vz_common)}<p class="small" style="margin:14px 0 0">${t.vz_note}</p></div>

  renderGuide();
  $('#links').innerHTML = Object.entries(t.l).map(([k, [a, b]], i) => `<a class="banner ${i < 2 ? 'primary' : ''}" href="${D.url[k]}" target="_blank" rel="noopener"><span>${a}<small>${b}</small></span><span>↗</span></a>`).join('');

    <a class="banner" href="tel:+82535897941"><span>053-589-7941<small>${t.c1} · KakaoTalk ID: kmcu7941</small></span><span>☎</span></a>
    <a class="banner" href="tel:+82535897359"><span>053-589-7359<small>${t.c2} · KakaoTalk ID: Trangmilo2305</small></span><span>☎</span></a>
    <a class="banner" href="mailto:ofofarmer@kmcu.ac.kr"><span>ofofarmer@kmcu.ac.kr<small>${t.c_mail}</small></span><span>✉</span></a>
    <div class="banner"><span>${t.c_addr}<small>${t.addr}</small></span></div>`;
}

  const t = L(), i = LI[lang], g = D.deg;

  const degDocs = [['app', 1, 1], ['edu', 1, 1], ['bal', 1, 1], ['income', 1, 0], ['family', 1, 1], ['pid', 1, 0], ['birth', 1, 1], ['langscore', 1, 1], ['lsdocs', 0, 1], ['passport', 1, 1], ['visafee', 0, 1], ['lease', 0, 1]];

  fold(t.gt_ls, `

    ${table([t.th_term, t.th_classp, t.th_apply, t.th_int], D.ls.terms.map(x => [`<b>${t.terms[x[0]]}</b>`, fr(x[1], x[2]), fr(x[3], x[4]), fr(x[5], x[6])]))}

    <h4>${t.h_steps}</h4><ol>${t.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <h4>${t.h_docs}</h4>${ul(lsDocs.map(k => t.d[k]))}<p class="small">${t.ls_docs_extra} ${t.docs_note}</p>
    <h4>${t.h_perks}</h4>${ul(t.perks)}`) +
  fold(t.gt_deg, `
    <h4>${t.h_req}</h4>${ul(t.req)}
    <h4>${t.h_rounds}</h4>
    ${table([t.th_round, t.th_apply2, t.th_int2, t.th_result], g.rounds.map(r => [`<b>${r[0]}</b>`, fr(r[1], r[2]), fr(r[3], r[4]), fd(r[5])]))}
    <p class="small">${t.reg_note}</p>
    <h4>${t.h_sch}</h4>
    ${table([t.th_cond, t.th_rate, ...g.groups.map(x => t.g[x[0]])], [['t2', .5], ['t5', .7], ['t6', .8]].map(([k, r]) => [t.sch[k], `<b>${r * 100}%</b>`, ...g.groups.map(x => fmt(x[1] - Math.round(x[1] * r)))]), [2, 3, 4])}
    <p class="small">${t.union_note} ${t.sch_after}</p>
    <h4>${t.h_docs}</h4>
    ${table([t.th_doc, t.th_abroad, t.th_dom], degDocs.map(([k, a, b]) => [t.d[k], dot(a), dot(b)]))}
    <p class="small">${t.docs_note}</p>
    <h4>${t.r_int}</h4><p>${t.int_text}</p>
    <h4>${t.h_how}</h4><p>${t.how}</p>`) +
  fold(t.gt_dept, `<div class="depts">${DEPTS.map(([f, ds]) => `<div><h5>${f[i]}</h5><ul>${ds.map(d => `<li>${d[i]}</li>`).join('')}</ul></div>`).join('')}</div>`) +
  fold(t.gt_dorm, `${table([t.th_room, t.th_type, t.th_price], D.dorm.map(([k, p]) => [t.dorm[k][0], t.dorm[k][1], fmt(p)]), [2])}<p class="small">${t.dorm_note}</p>`);
}

// ===== 진단 =====
let S = { track: 'ls', a: {} };
const FLOW = {
  ls: a => a.edu == null ? 'edu' : a.edu === 'no' ? null
    : a.kor == null ? 'kor' : a.kor === 'yes' ? null
    : a.country == null ? 'country'
    : FOUR.includes(a.country) && a.gap == null ? 'gap'
    : a.money == null ? 'money' : null,
  deg: a => a.edu == null ? 'edu' : a.edu === 'no' ? null
    : a.kor == null ? 'kor' : a.kor === 'yes' ? null
    : a.parent == null ? 'parent' : a.parent === 'no' ? null
    : a.where == null ? 'where'
    : a.lang == null ? 'lang' : null,
};
const chat = () => $('#chat');
function say(html, me) {
  const d = document.createElement('div');
  d.className = 'msg' + (me ? ' me' : '');
  d.innerHTML = (me ? '' : '<div class="av"><img src="assets/img/emblem.png" alt=""></div>') + `<div class="bub">${html}</div>`;
  chat().append(d);
  d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function start(track) {
  S = { track, a: {} };
  document.body.classList.add('diag');
  window.scrollTo(0, 0);
  chat().innerHTML = `<div class="top"><button class="pill line sm" data-home>${L().back}</button></div>`;
  say(L()['hello_' + track]);
  setTimeout(step, 350);
}
function step() {
  const id = FLOW[S.track](S.a);
  if (!id) return result();
  const [q, opts] = L().q[id];
  say(fill(q, { bal: fmt(D.ls.bal) }));
  const box = document.createElement('div'); box.className = 'opts';
  for (const [v, label] of Object.entries(opts)) {
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => { box.remove(); say(label, true); S.a[id] = v; setTimeout(step, 350); };
    box.append(b);
  }
  chat().append(box);
  box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function result() {
  const t = L(), a = S.a, r = S.track === 'ls' ? lsResult(t, a) : degResult(t, a);
  const d = document.createElement('div'); d.className = 'result';
  d.innerHTML = `<div class="status ${r.st}">${t['r_' + r.st]}</div>
    ${r.notes.length ? sec(t.r_notes, ul(r.notes)) : ''}${r.body || ''}
    <div class="actions">${r.actions.join('')}<button class="pill line sm" onclick="start('${S.track}')">${t.btn_restart}</button></div>`;
  chat().append(d);
  d.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
const linkBtn = (href, label, primary) => `<a class="pill sm ${primary ? 'dark' : 'line'}" href="${href}" ${href.startsWith('http') ? 'target="_blank" rel="noopener"' : 'data-home'}>${label}</a>`;
const goBtn = (track, label) => `<button class="pill line sm" onclick="start('${track}')">${label} →</button>`;

function lsResult(t, a) {
  const notes = [], contact = linkBtn('#contact', t.btn_contact);
  if (a.edu === 'no') return { st: 'no', notes: [t.no_edu], actions: [contact] };
  if (a.kor === 'yes') return { st: 'no', notes: [t.no_kor], actions: [contact] };
  let st = 'ok';
  const four = FOUR.includes(a.country);
  if (a.edu === 'soon') { st = 'cond'; notes.push(t.soon); }
  if (a.money === 'unsure') { st = 'cond'; notes.push(fill(t.money_unsure, { bal: fmt(D.ls.bal) })); }
  if (a.gap === 'yes') notes.push(t.gap_note);
  if (four) notes.push(t.ccvi);
  const nt = D.ls.terms.find(x => x[4] >= today);
  const sched = nt
    ? `<p>${fill(nt[3] <= today ? t.ls_open : t.ls_next, { term: t.terms[nt[0]], a: fd(nt[3]), b: fd(nt[4]) })}<br><span class="small">${fill(t.ls_class, { a: fd(nt[1]), b: fd(nt[2]) })}</span></p>`
    : `<p>${t.ls_tba}</p>`;
  const docs = ['sheet', 'passport', 'bal', 'edu', 'income', 'family', 'pid', 'birth', 'app', ...(four ? ['translator', a.gap === 'yes' && 'explain', 'photos'] : [])]
    .filter(Boolean).map(k => k === 'edu' ? `${t.d.edu} · ${t.educ[a.country]}` : t.d[k]);
  const body =
    sec(t.r_visa, `<p>${t.rv_ls}</p><p class="small">${t.rv_after}</p>`) +
    sec(t.r_sched, sched) +
    sec(t.r_cost, table(null, [[t.c_app, fmt(D.ls.app)], [t.c_year, fmt(D.ls.fee)], [t.c_topik, fmt(D.ls.topik)], [t.c_dorm, fmt(490000) + ' ~ ' + fmt(820000)]], [1])) +
    sec(t.r_bal, `<p><b>${fmt(D.ls.bal)}</b> ${t.bal_valid}<br>${t.balc[a.country]}</p>${a.country !== 'vn' ? `<p class="small">${t.bal_6m}</p>` : ''}`) +
    sec(t.r_docs, checks(docs) + `<p class="small">${t.docs_note}</p>`) +
    sec(t.r_bridge, `<p>${fill(t.bridge_r, { kmcu: fmt(D.deg.balKmcu) })}</p>`);
  return { st, notes, body, actions: [linkBtn(D.url.applyLs, t.btn_apply + ' ↗', true), contact, goBtn('deg', t.btn_to_deg)] };
}

function degResult(t, a) {
  const notes = [], contact = linkBtn('#contact', t.btn_contact), g = D.deg;
  if (a.edu === 'no') return { st: 'no', notes: [t.no_edu], actions: [contact, goBtn('ls', t.btn_to_ls)] };
  if (a.kor === 'yes') return { st: 'no', notes: [t.no_kor], actions: [contact] };
  if (a.parent === 'no') return { st: 'no', notes: [t.no_parent], actions: [contact] };
  let st = 'ok';
  if (a.edu === 'soon') { st = 'cond'; notes.push(t.soon); }
  if (a.lang === 'none') { st = 'cond'; notes.push(t.lang_none); }
  if (['kmcu', 'sejong', 'eng'].includes(a.lang)) notes.push(t.lang_temp);
  if (a.where === 'ef') notes.push(t.ef);
  if (a.where === 'kmcu') notes.push(t.kmcu_student);
  const r = g.rounds.find(x => x[2] >= today);
  const sched = r
    ? `<p>${fill(r[1] <= today ? t.deg_open : t.deg_next, { n: r[0], a: fd(r[1]), b: fd(r[2]) })}<br><span class="small">${fill(t.deg_after, { i: fr(r[3], r[4]), r: fd(r[5]) })}</span></p>`
    : `<p>${t.deg_closed}</p>`;
  const rate = g.rate[a.lang];
  const tuition = table([t.th_group, t.th_base, t.th_sch, t.th_pay], g.groups.map(([k, base]) => {
    const s = Math.round(base * rate);
    return [t.g[k], fmt(base), rate ? `−${fmt(s)} (${rate * 100}%)` : '–', `<b>${fmt(base - s)}</b>`];
  }), [1, 2, 3]) + `<p class="small">${t.union_note}</p>`;
  const abroad = a.where === 'abroad';
  const docs = (abroad ? ['app', 'edu', 'bal', 'income', 'family', 'pid', 'birth', 'langscore', 'passport']
    : ['app', 'edu', 'bal', 'family', 'birth', 'langscore', a.where === 'kmcu' && 'lsdocs', 'passport', 'visafee', 'lease'])
    .filter(Boolean).map(k => k === 'edu' ? `${t.d.edu} · ${t.educ.deg}` : t.d[k]);
  const bal = a.where === 'kmcu' ? g.balKmcu : g.bal;
  const body =
    sec(t.r_visa, `<p>${a.where === 'ef' ? t.rv_ef : abroad ? t.rv_abroad : t.rv_dom}</p>${abroad ? `<p class="small">${t.rv_after}</p>` : ''}`) +
    sec(t.r_sched, sched) +
    sec(t.r_tuition, tuition) +
    sec(t.r_bal, `<p><b>${fmt(bal)}</b> · ${t.bal_deg}</p>`) +
    sec(t.r_docs, checks(docs) + `<p class="small">${t.docs_note}</p>`) +
    sec(t.r_int, `<p>${t.int_text}</p>`);
  const actions = [linkBtn(D.url.applyDeg, t.btn_apply + ' ↗', true), contact];
  if (a.lang === 'none') actions.push(goBtn('ls', t.btn_to_ls));
  return { st, notes, body, actions };
}

// ===== 이벤트 =====
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); start(go.dataset.go); return; }
  if (e.target.closest('[data-home]')) document.body.classList.remove('diag'); // 링크 기본 동작(앵커 이동)은 그대로
  const lb = e.target.closest('[data-lang]');
  if (lb) {
    lang = lb.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch (_) {}
    renderStatic();
    if (isDiag()) start(S.track);
  }
});

// 스크롤 등장 효과. 같은 줄에 놓인 요소(카드 2장, 사진+글)는 조금씩 늦게 떠오른다.
const io = 'IntersectionObserver' in window && new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target;
  io.unobserve(el);
  el.classList.add('in');
  // 등장이 끝나면 지우기: 남겨 두면 카드 hover 효과까지 느려진다
  setTimeout(() => { el.classList.remove('rv', 'in'); el.style.transitionDelay = ''; }, 1300);
}), { rootMargin: '0px 0px -8% 0px' });
function reveal() {
  if (!io) return;
  $$('main .split > *, main .center, main .card, main .note, main .vcommon, #guide h2, #guide .lead, #guideBody details').forEach(el => {
    if (el.dataset.rv) return;
    el.dataset.rv = 1;
    const sibs = [...el.parentElement.children].filter(c => c.matches('.split > *, .card'));
    el.style.transitionDelay = Math.max(0, sibs.indexOf(el)) * 0.12 + 's';
    el.classList.add('rv');
    io.observe(el);
  });
}
const _render = renderStatic;
renderStatic = () => { _render(); reveal(); };
renderStatic();
</script>
</body>
